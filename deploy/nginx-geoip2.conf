# GeoIP2 country lookup for the grains game.
#
# Install to /etc/nginx/conf.d/geoip2.conf (loaded via `include conf.d/*.conf`
# in the http{} block of nginx.conf). Requires the ngx_http_geoip2_module
# (Debian/Ubuntu package `libnginx-mod-http-geoip2`, auto-enabled through
# /etc/nginx/modules-enabled/) and the GeoLite2-Country.mmdb kept fresh by
# geoipupdate (deploy/geoip/).
#
#   sudo cp deploy/nginx-geoip2.conf /etc/nginx/conf.d/geoip2.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# IMPORTANT: install this file BEFORE adding the X-Country-* headers to the
# server block — otherwise nginx -t fails with "unknown variable geoip2_...".
#
# nginx is the internet-facing edge here (clients connect directly to :80), so
# $remote_addr IS the real client IP — the same address the WS server hashes
# (it reads the rightmost X-Forwarded-For entry, which nginx sets to
# $remote_addr via $proxy_add_x_forwarded_for). If a CDN/extra proxy is ever put
# in front of nginx, switch `source=` to the appropriate X-Forwarded-For value
# and revisit the WS server's client-IP pick (Phase 2) to keep them consistent.

geoip2 /usr/share/GeoIP/GeoLite2-Country.mmdb {
    # Pick up a freshly-downloaded database without an nginx reload.
    auto_reload 12h;

    $geoip2_country_code source=$remote_addr default=XX country iso_code;
    $geoip2_country_name source=$remote_addr default=Unknown country names en;
}
