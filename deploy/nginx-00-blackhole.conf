# /etc/nginx/sites-available/00-blackhole
# Catch-all default server: makes the bare VPS IP (and any hostname we don't
# explicitly serve) show NOTHING. Requests to 209.141.52.60 or an unknown Host
# are dropped, so no site is discoverable via the raw IP.
#
# Real sites are served only by their name-based vhosts:
#   1grainofrice.com / www   -> $RICE app        (sites-available/1grainofrice)
#   game.1grainofrice.com     -> RiceDAO          (sites-available/game.1grainofrice.com)
#   cxmz.io                   -> CXMZ             (sites-available/cxmz-site)
#
# This REPLACES the old ip-rice default_server (which redirected the IP root to
# /CXMZ/ and path-hosted every app). ip-rice is retired — unlink it.
#
# The filename sorts first (00-) so nothing else accidentally claims
# default_server. There must be exactly one default_server per listen port.

# Plain HTTP on the bare IP / unknown host: close the connection with no reply.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# HTTPS on the bare IP / unknown SNI: reject the TLS handshake outright (nginx
# >= 1.19.4). No certificate is presented, so https://<IP> just fails to
# connect instead of serving someone else's cert + site.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
